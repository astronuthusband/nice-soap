<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nice Soap — Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5EC;--surface:#FFFFFF;--ink:#1D2B23;--muted:#586A5E;--line:#D6DECD;
  --sage:#A7BFA1;--accent:#E9A93B;--accent-ink:#2A1D00;--danger:#B3402F;--ok:#3E7A4C;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121A15;--surface:#1B2620;--ink:#EDF2E8;--muted:#9FB0A4;--line:#2B3A31;--sage:#4C6B55;--danger:#F08A78;--ok:#7FCB91;}
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand{font-family:'Young Serif',Georgia,serif;font-weight:400;margin:0}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.65rem 1.1rem;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 85%,var(--bg))}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.small{padding:.4rem .8rem;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;color:var(--muted)}
.link:hover{color:var(--ink)}
input,select,textarea{font:inherit;padding:.6rem .8rem;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--ink)}
label{display:grid;gap:.35rem;font-weight:600;font-size:.92rem}
.fine{color:var(--muted);font-size:.88rem}
.err{color:var(--danger);font-weight:600;font-size:.92rem}
.ok{color:var(--ok);font-weight:600;font-size:.92rem}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:2rem;width:100%;max-width:360px;display:grid;gap:1rem}
.card h1{font-size:1.8rem;text-align:center}

/* Shell */
#app{display:none;min-height:100vh}
header.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1.3rem;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .brand{font-size:1.4rem}
.who{display:flex;align-items:center;gap:.8rem}
.who span{color:var(--muted);font-size:.9rem}
main{max-width:1180px;margin:0 auto;padding:1.5rem clamp(1rem,4vw,2rem) 4rem}
.tabs{display:flex;gap:.5rem;margin-bottom:1.4rem;flex-wrap:wrap}
.tab{padding:.55rem 1.2rem;border-radius:999px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.badge{display:inline-flex;min-width:1.4rem;height:1.4rem;padding:0 .35rem;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.78rem;font-weight:700;align-items:center;justify-content:center;margin-left:.4rem}
.panel{display:none}
.panel.active{display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
.toolbar .filters{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{padding:.4rem .9rem;border-radius:999px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* Orders */
.orders{display:grid;gap:.9rem}
.order{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.3rem}
.order summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem}
.order summary::-webkit-details-marker{display:none}
.order .num{font-weight:700}
.order .name{color:var(--muted)}
.order .total{margin-left:auto;font-weight:700}
.pill{padding:.25rem .7rem;border-radius:999px;font-size:.8rem;font-weight:600;border:1.5px solid var(--line)}
.pill.new{border-color:var(--accent);color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 25%,transparent)}
.pill.confirmed,.pill.packed{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 30%,transparent)}
.pill.shipped,.pill.delivered{border-color:var(--ok);color:var(--ok);background:transparent}
.pill.cancelled{border-color:var(--danger);color:var(--danger)}
.pill.paid{border-color:var(--ok);color:var(--ok)}
.pill.unpaid{border-color:var(--danger);color:var(--danger)}
.pill.refunded{border-color:var(--muted);color:var(--muted)}
.order .body{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line);display:grid;gap:1rem}
@media(min-width:720px){.order .body{grid-template-columns:1.3fr 1fr}}
.order dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.35rem .8rem;font-size:.92rem}
.order dt{color:var(--muted)}
.order ul.items{list-style:none;margin:0;padding:0;display:grid;gap:.4rem;font-size:.92rem}
.order .controls{display:flex;flex-wrap:wrap;gap:.7rem;align-items:end}
.order .controls label{flex:1 1 140px}
.empty{color:var(--muted);padding:2rem 0;text-align:center}

/* Products */
.products{display:grid;gap:.9rem}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.9rem 1.1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.prow .thumb{width:56px;height:56px;border-radius:12px;background:color-mix(in srgb,var(--c,var(--sage)) 45%,var(--bg));flex:none;display:grid;place-items:center;overflow:hidden}
.prow .thumb img{width:100%;height:100%;object-fit:cover}
.prow .info{flex:1 1 200px;min-width:0}
.prow .info h3{font-size:1.05rem}
.prow .info p{margin:.15rem 0 0;color:var(--muted);font-size:.85rem}
.prow .stockbox{display:flex;align-items:center;gap:.4rem}
.prow .stockbox input{width:5.5rem}
.stock-low{color:var(--danger);font-weight:600}
.tag{font-size:.78rem;padding:.15rem .55rem;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.tag.inactive{border-color:var(--danger);color:var(--danger)}
.tag.best{border-color:var(--accent);color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 25%,transparent)}

/* Modal */
dialog{border:0;padding:0;border-radius:22px;background:var(--surface);color:var(--ink);width:calc(100% - 1.5rem);max-width:640px;max-height:calc(100% - 1.5rem);overflow:auto}
dialog::backdrop{background:rgba(12,20,15,.55)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 1.3rem .6rem}
.modal-head h2{font-size:1.5rem}
.modal-body{padding:0 1.3rem 1.3rem;display:grid;gap:.9rem}
.fields{display:grid;gap:.9rem}
@media(min-width:520px){.fields{grid-template-columns:1fr 1fr}.fields .full{grid-column:1/-1}}
.icon-btn{width:2.2rem;height:2.2rem;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:.5rem}
.swatches button{width:2rem;height:2rem;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.modal-foot{display:flex;justify-content:space-between;gap:.8rem;padding-top:.4rem}
.spin{display:inline-block;width:1em;height:1em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:.75rem 1.3rem;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{padding:3rem 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="login">
  <form class="card" id="loginForm">
    <h1>Nice Soap</h1>
    <p class="fine" style="text-align:center;margin-top:-.6rem">Admin sign in</p>
    <label>Email<input type="email" id="loginEmail" required autocomplete="username"></label>
    <label>Password<input type="password" id="loginPassword" required autocomplete="current-password"></label>
    <p class="err" id="loginErr" role="alert" hidden></p>
    <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
    <p class="fine">Access is limited to accounts added to the <code>admins</code> table in Supabase. See SETUP.md.</p>
  </form>
</div>

<div id="app">
  <header class="top">
    <span class="brand">Nice Soap</span>
    <div class="who">
      <span id="whoEmail"></span>
      <button class="btn small" id="signOutBtn" type="button">Sign out</button>
    </div>
  </header>
  <main>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabOrdersBtn" aria-selected="true">Orders<span class="badge" id="newBadge" hidden>0</span></button>
      <button class="tab" role="tab" id="tabProductsBtn" aria-selected="false">Products<span class="badge" id="lowBadge" hidden>0</span></button>
    </div>

    <section class="panel active" id="panelOrders">
      <div class="toolbar">
        <div class="filters" id="orderFilters" role="group" aria-label="Filter orders by status"></div>
        <button class="btn small" id="refreshOrders" type="button">Refresh</button>
      </div>
      <div id="ordersList"><div class="loading">Loading orders…</div></div>
    </section>

    <section class="panel" id="panelProducts">
      <div class="toolbar">
        <p class="fine" id="stockSummary"></p>
        <button class="btn primary small" id="newProductBtn" type="button">Add product</button>
      </div>
      <div id="productsList"><div class="loading">Loading products…</div></div>
    </section>
  </main>
</div>

<dialog id="dlgProduct" aria-labelledby="pmTitle">
  <form id="productForm">
    <div class="modal-head"><h2 id="pmTitle">Add product</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="fields">
        <label class="full">Name<input id="pfName" required maxlength="100"></label>
        <label>Id (used in the URL) <input id="pfId" required pattern="[a-z0-9-]{2,40}" placeholder="lavender-calm"></label>
        <label>Category
          <select id="pfCategory"><option value="floral">Floral</option><option value="herbal">Herbal</option><option value="citrus">Citrus</option><option value="unscented">Unscented</option></select>
        </label>
        <label>Price per bar (MYR)<input id="pfPrice" type="number" min="0" step="0.01" required></label>
        <label>Stock (bars)<input id="pfStock" type="number" min="0" step="1" required></label>
        <label class="full">Scent notes<input id="pfNotes" maxlength="120" placeholder="e.g. Lemongrass, lemon peel, ginger"></label>
        <label class="full">Description<textarea id="pfDesc" rows="3" maxlength="600"></textarea></label>
        <label class="full">Ingredients<textarea id="pfIng" rows="2" maxlength="600"></textarea></label>
        <label class="full">Photo
          <input type="file" id="pfPhoto" accept="image/png,image/jpeg,image/webp">
          <p class="fine" id="pfPhotoNote">No photo yet — a soap-bar icon is used instead.</p>
        </label>
        <div class="full">
          <label style="margin-bottom:.5rem;display:block">Icon color (used until a photo is added)</label>
          <div class="swatches" id="pfSwatches"></div>
        </div>
        <label><input type="checkbox" id="pfBest" style="width:auto"> Show in Best sellers</label>
        <label><input type="checkbox" id="pfActive" style="width:auto" checked> Visible in the shop</label>
      </div>
      <p class="err" id="pfErr" role="alert" hidden></p>
      <div class="modal-foot">
        <span></span>
        <span style="display:flex;gap:.6rem">
          <button type="button" class="btn" data-close>Cancel</button>
          <button type="submit" class="btn primary" id="pfSave">Save product</button>
        </span>
      </div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
(function(){
'use strict';
var CFG = window.NICE_SOAP_CONFIG || {};
if(!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY){
  document.getElementById('loginErr').hidden = false;
  document.getElementById('loginErr').textContent = 'admin/config.js is not set up yet. Paste your Supabase URL and anon key into it first.';
  document.getElementById('loginBtn').disabled = true;
}
var API = (CFG.SUPABASE_URL || '').replace(/\/+$/, '');
var SESSION_KEY = 'nicesoap-admin-session';
var session = null;
try { session = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch(e){}

var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
var esc = function(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
};
var fmt = function(n){ return 'RM ' + Number(n).toFixed(2); };
var fmtDate = function(iso){
  try { return new Date(iso).toLocaleString('en-MY', {dateStyle:'medium', timeStyle:'short'}); }
  catch(e){ return iso; }
};

var tt;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

/* ---------- API helpers ---------- */
function authHeaders(){
  return {
    'apikey': CFG.SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + (session ? session.access_token : CFG.SUPABASE_ANON_KEY)
  };
}
function api(path, opt){
  opt = opt || {};
  var headers = Object.assign({}, authHeaders(), opt.headers || {});
  return fetch(API + path, Object.assign({}, opt, {headers: headers}))
    .then(function(r){
      if(r.status === 401) { signOut(); throw new Error('Your session expired. Please sign in again.'); }
      return r.text().then(function(t){
        var body = null; try { body = t ? JSON.parse(t) : null; } catch(e){}
        if(!r.ok) throw new Error((body && (body.message || body.msg || body.error_description)) || 'Request failed (' + r.status + ').');
        return body;
      });
    });
}

/* ---------- Auth ---------- */
function signIn(email, password){
  return fetch(API + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'apikey': CFG.SUPABASE_ANON_KEY},
    body: JSON.stringify({email: email, password: password})
  }).then(function(r){
    return r.json().then(function(body){
      if(!r.ok) throw new Error(body.error_description || body.msg || 'Could not sign in.');
      return body;
    });
  }).then(function(body){
    session = {access_token: body.access_token, email: body.user && body.user.email};
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
    return checkAdmin();
  });
}
function checkAdmin(){
  return api('/rest/v1/rpc/is_admin', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
    .then(function(isAdmin){
      if(!isAdmin){ signOut(); throw new Error('This account isn\u2019t set up as an admin yet. Ask the shop owner to add it in Supabase.'); }
    });
}
function signOut(){
  session = null;
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'grid';
}

$('#loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var btn = $('#loginBtn'), err = $('#loginErr');
  err.hidden = true; btn.disabled = true; btn.textContent = 'Signing in\u2026';
  signIn($('#loginEmail').value.trim(), $('#loginPassword').value)
    .then(showApp)
    .catch(function(e){ err.textContent = e.message; err.hidden = false; })
    .then(function(){ btn.disabled = false; btn.textContent = 'Sign in'; });
});
$('#signOutBtn').addEventListener('click', signOut);

function showApp(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  $('#whoEmail').textContent = session && session.email || '';
  loadOrders();
  loadProducts();
}

/* ---------- Tabs ---------- */
function selectTab(name){
  $('#tabOrdersBtn').setAttribute('aria-selected', name === 'orders');
  $('#tabProductsBtn').setAttribute('aria-selected', name === 'products');
  $('#panelOrders').classList.toggle('active', name === 'orders');
  $('#panelProducts').classList.toggle('active', name === 'products');
}
$('#tabOrdersBtn').addEventListener('click', function(){ selectTab('orders'); });
$('#tabProductsBtn').addEventListener('click', function(){ selectTab('products'); });

/* ---------- Orders ---------- */
var ORDER_STATUSES = ['new','confirmed','packed','shipped','delivered','cancelled'];
var PAY_STATUSES = ['unpaid','paid','refunded'];
var orderFilter = 'open';
var orders = [];

function renderOrderFilters(){
  var defs = [['open','Open'],['all','All'],['new','New'],['confirmed','Confirmed'],['packed','Packed'],['shipped','Shipped'],['delivered','Delivered'],['cancelled','Cancelled']];
  $('#orderFilters').innerHTML = defs.map(function(d){
    return '<button type="button" class="chip" data-filter="'+d[0]+'" aria-pressed="'+(orderFilter===d[0])+'">'+d[1]+'</button>';
  }).join('');
}
function loadOrders(){
  api('/rest/v1/orders?select=*,order_items(*)&order=created_at.desc&limit=200')
    .then(function(rows){ orders = rows || []; renderOrders(); })
    .catch(function(e){ $('#ordersList').innerHTML = '<p class="err">'+esc(e.message)+'</p>'; });
}
function renderOrders(){
  var list = orders.filter(function(o){
    if(orderFilter === 'all') return true;
    if(orderFilter === 'open') return o.status !== 'delivered' && o.status !== 'cancelled';
    return o.status === orderFilter;
  });
  var newCount = orders.filter(function(o){ return o.status === 'new'; }).length;
  var badge = $('#newBadge');
  badge.hidden = newCount === 0; badge.textContent = newCount;

  $('#ordersList').innerHTML = list.length ? list.map(orderHTML).join('') :
    '<p class="empty">No orders in this view.</p>';
}
function orderHTML(o){
  var items = (o.order_items || []).slice().sort(function(a,b){ return a.id - b.id; });
  var itemsHtml = items.map(function(i){
    return '<li>'+i.qty+' \u00d7 '+esc(i.product_name)+' ('+(i.size === 'set' ? 'set of 3' : 'bar')+') \u2014 '+fmt(i.line_total)+'</li>';
  }).join('');
  return '<details class="order" data-order="'+esc(o.order_no)+'">' +
    '<summary>' +
      '<span class="num">'+esc(o.order_no)+'</span>' +
      '<span class="name">'+esc(o.customer_name)+'</span>' +
      '<span class="pill '+o.status+'">'+cap(o.status)+'</span>' +
      '<span class="pill '+o.payment_status+'">'+cap(o.payment_status)+'</span>' +
      '<span class="total">'+fmt(o.total)+'</span>' +
    '</summary>' +
    '<div class="body">' +
      '<div>' +
        '<dl>' +
          '<dt>Placed</dt><dd>'+esc(fmtDate(o.created_at))+'</dd>' +
          '<dt>Phone</dt><dd>'+esc(o.phone)+'</dd>' +
          '<dt>Email</dt><dd>'+esc(o.email)+'</dd>' +
          '<dt>Deliver to</dt><dd>'+esc(o.address)+', '+esc(o.postcode)+' '+esc(o.state)+'</dd>' +
          '<dt>Payment</dt><dd>'+(o.payment_method === 'cod' ? 'Cash on delivery' : 'Bank transfer / DuitNow')+'</dd>' +
          '<dt>Subtotal</dt><dd>'+fmt(o.subtotal)+'</dd>' +
          '<dt>Delivery</dt><dd>'+(Number(o.shipping) > 0 ? fmt(o.shipping) : 'Free')+'</dd>' +
        '</dl>' +
        '<ul class="items" style="margin-top:.8rem">'+itemsHtml+'</ul>' +
      '</div>' +
      '<div class="controls">' +
        '<label>Order status<select data-order-status>'+ORDER_STATUSES.map(function(s){ return '<option value="'+s+'"'+(s===o.status?' selected':'')+'>'+cap(s)+'</option>'; }).join('')+'</select></label>' +
        '<label>Payment status<select data-pay-status>'+PAY_STATUSES.map(function(s){ return '<option value="'+s+'"'+(s===o.payment_status?' selected':'')+'>'+cap(s)+'</option>'; }).join('')+'</select></label>' +
      '</div>' +
    '</div>' +
  '</details>';
}
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

$('#orderFilters').addEventListener('click', function(e){
  var b = e.target.closest('[data-filter]'); if(!b) return;
  orderFilter = b.getAttribute('data-filter'); renderOrderFilters(); renderOrders();
});
$('#refreshOrders').addEventListener('click', loadOrders);

document.addEventListener('change', function(e){
  var sel = e.target.closest('[data-order-status],[data-pay-status]');
  if(!sel) return;
  var details = sel.closest('.order'), orderNo = details.getAttribute('data-order');
  var field = sel.hasAttribute('data-order-status') ? 'status' : 'payment_status';
  var value = sel.value;
  var order = orders.filter(function(o){ return o.order_no === orderNo; })[0];
  var prev = order ? order[field] : null;
  sel.disabled = true;
  api('/rest/v1/orders?order_no=eq.' + encodeURIComponent(orderNo), {
    method: 'PATCH',
    headers: {'Content-Type':'application/json', 'Prefer':'return=minimal'},
    body: JSON.stringify((function(){ var b = {}; b[field] = value; return b; })())
  }).then(function(){
    if(order) order[field] = value;
    // Re-render just this order's pills without losing scroll position.
    var wasOpen = details.hasAttribute('open');
    var html = orderHTML(order);
    var tmp = document.createElement('div'); tmp.innerHTML = html;
    var fresh = tmp.firstElementChild;
    if(wasOpen) fresh.setAttribute('open', '');
    details.replaceWith(fresh);
    toast('Order ' + orderNo + ' updated');
    if(field === 'status' && (value === 'cancelled' || prev === 'cancelled')) loadProducts();
  }).catch(function(e){
    sel.value = prev;
    sel.disabled = false;
    toast(e.message);
  });
});

/* ---------- Products ---------- */
var MOTIFS = ['leaf','slice','flower','drop','hex','dots'];
var SWATCHES = ['#9DC58B','#E4DC7A','#EBB4BA','#BCD66A','#66726C','#EFE3C2','#E6CFA3','#EEEBDD','#C9B6E4','#F2A65A'];
var products = [];
var editingId = null;

function loadProducts(){
  api('/rest/v1/products?select=*&order=sort_order.asc,created_at.asc')
    .then(function(rows){ products = rows || []; renderProducts(); })
    .catch(function(e){ $('#productsList').innerHTML = '<p class="err">'+esc(e.message)+'</p>'; });
}
function renderProducts(){
  var low = products.filter(function(p){ return p.active && p.stock <= 5; }).length;
  var badge = $('#lowBadge');
  badge.hidden = low === 0; badge.textContent = low;
  var totalStock = products.reduce(function(a,p){ return a + (p.stock || 0); }, 0);
  $('#stockSummary').textContent = products.length + ' product' + (products.length===1?'':'s') + ' \u00b7 ' + totalStock + ' bars in stock';

  $('#productsList').innerHTML = products.length ? products.map(prowHTML).join('') :
    '<p class="empty">No products yet. Add your first one.</p>';
}
function prowHTML(p){
  var thumb = p.image_url ? '<img src="'+esc(p.image_url)+'" alt="" loading="lazy">' : '';
  return '<div class="prow" data-id="'+esc(p.id)+'" style="--c:'+esc(p.color||'#D6DECD')+'">' +
    '<div class="thumb">'+thumb+'</div>' +
    '<div class="info">' +
      '<h3>'+esc(p.name)+' ' + (!p.active ? '<span class="tag inactive">Hidden</span>' : '') + (p.best_seller ? '<span class="tag best">Best seller</span>' : '') + '</h3>' +
      '<p>'+esc(cap(p.category))+' \u00b7 '+fmt(p.price_myr)+' per bar</p>' +
    '</div>' +
    '<div class="stockbox">' +
      '<label class="sr" for="stock-'+esc(p.id)+'">Stock for '+esc(p.name)+'</label>' +
      '<input id="stock-'+esc(p.id)+'" type="number" min="0" step="1" value="'+p.stock+'" data-stock class="'+(p.stock<=5?'stock-low':'')+'">' +
    '</div>' +
    '<button type="button" class="btn small" data-edit>Edit</button>' +
    '<button type="button" class="btn small" data-toggle-active>'+(p.active?'Hide':'Show')+'</button>' +
  '</div>';
}

$('#productsList').addEventListener('click', function(e){
  var row = e.target.closest('.prow'); if(!row) return;
  var id = row.getAttribute('data-id');
  var p = products.filter(function(x){ return x.id === id; })[0];
  if(e.target.closest('[data-edit]')) openProductModal(p);
  if(e.target.closest('[data-toggle-active]')) toggleActive(p);
});
$('#productsList').addEventListener('change', function(e){
  var input = e.target.closest('[data-stock]'); if(!input) return;
  var row = e.target.closest('.prow'), id = row.getAttribute('data-id');
  var p = products.filter(function(x){ return x.id === id; })[0];
  var value = Math.max(0, parseInt(input.value, 10) || 0);
  input.value = value;
  var prev = p.stock;
  input.disabled = true;
  api('/rest/v1/products?id=eq.' + encodeURIComponent(id), {
    method:'PATCH', headers:{'Content-Type':'application/json','Prefer':'return=minimal'},
    body: JSON.stringify({stock: value})
  }).then(function(){
    p.stock = value; input.classList.toggle('stock-low', value <= 5);
    toast('Stock updated for ' + p.name);
    renderProducts();
  }).catch(function(e){ input.value = prev; toast(e.message); }).then(function(){ input.disabled = false; });
});
function toggleActive(p){
  api('/rest/v1/products?id=eq.' + encodeURIComponent(p.id), {
    method:'PATCH', headers:{'Content-Type':'application/json','Prefer':'return=minimal'},
    body: JSON.stringify({active: !p.active})
  }).then(function(){ p.active = !p.active; renderProducts(); toast(p.name + (p.active ? ' is now visible' : ' is now hidden')); })
    .catch(function(e){ toast(e.message); });
}

/* ---------- Product modal ---------- */
$('#pfSwatches').innerHTML = SWATCHES.map(function(c){ return '<button type="button" data-color="'+c+'" style="background:'+c+'" aria-label="'+c+'"></button>'; }).join('');
var pickedColor = SWATCHES[0], pickedMotif = MOTIFS[0], pickedTone = 'dark', photoFile = null, existingImageUrl = null;

$('#pfSwatches').addEventListener('click', function(e){
  var b = e.target.closest('[data-color]'); if(!b) return;
  pickedColor = b.getAttribute('data-color');
  $$('#pfSwatches button').forEach(function(x){ x.setAttribute('aria-pressed', x === b); });
});
$('#pfPhoto').addEventListener('change', function(){
  photoFile = this.files && this.files[0] || null;
  $('#pfPhotoNote').textContent = photoFile ? 'Selected: ' + photoFile.name : (existingImageUrl ? 'A photo is already set. Choose a file to replace it.' : 'No photo yet — a soap-bar icon is used instead.');
});

function openProductModal(p){
  editingId = p ? p.id : null;
  $('#pmTitle').textContent = p ? 'Edit product' : 'Add product';
  $('#pfErr').hidden = true;
  $('#pfName').value = p ? p.name : '';
  $('#pfId').value = p ? p.id : '';
  $('#pfId').disabled = !!p;
  $('#pfCategory').value = p ? p.category : 'floral';
  $('#pfPrice').value = p ? p.price_myr : '';
  $('#pfStock').value = p ? p.stock : 0;
  $('#pfNotes').value = p ? p.notes || '' : '';
  $('#pfDesc').value = p ? p.description || '' : '';
  $('#pfIng').value = p ? p.ingredients || '' : '';
  $('#pfBest').checked = p ? !!p.best_seller : false;
  $('#pfActive').checked = p ? !!p.active : true;
  photoFile = null; existingImageUrl = p ? p.image_url : null;
  $('#pfPhoto').value = '';
  $('#pfPhotoNote').textContent = existingImageUrl ? 'A photo is already set. Choose a file to replace it.' : 'No photo yet — a soap-bar icon is used instead.';
  pickedColor = (p && p.color) || SWATCHES[0];
  pickedMotif = (p && p.motif) || MOTIFS[0];
  pickedTone = (p && p.tone) || 'dark';
  $$('#pfSwatches button').forEach(function(x){ x.setAttribute('aria-pressed', x.getAttribute('data-color') === pickedColor); });
  $('#dlgProduct').showModal();
}
$('#newProductBtn').addEventListener('click', function(){ openProductModal(null); });
$$('[data-close]', $('#dlgProduct')).forEach(function(b){ b.addEventListener('click', function(){ $('#dlgProduct').close(); }); });
$('#dlgProduct').addEventListener('click', function(e){ if(e.target === this) this.close(); });

function uploadPhoto(id, file){
  var path = id + '-' + Date.now() + '.' + (file.type.split('/')[1] || 'jpg');
  return file.arrayBuffer().then(function(buf){
    return fetch(API + '/storage/v1/object/product-images/' + path, {
      method: 'POST',
      headers: {'apikey': CFG.SUPABASE_ANON_KEY, 'Authorization':'Bearer ' + session.access_token, 'Content-Type': file.type},
      body: buf
    });
  }).then(function(r){
    if(!r.ok) return r.json().then(function(b){ throw new Error((b && b.message) || 'Photo upload failed.'); });
    return API + '/storage/v1/object/public/product-images/' + path;
  });
}

$('#productForm').addEventListener('submit', function(e){
  e.preventDefault();
  var err = $('#pfErr'), btn = $('#pfSave');
  err.hidden = true;

  var id = $('#pfId').value.trim().toLowerCase();
  if(!/^[a-z0-9-]{2,40}$/.test(id)){ err.textContent = 'Use only lowercase letters, numbers and dashes for the id.'; err.hidden = false; return; }
  var price = parseFloat($('#pfPrice').value);
  if(!(price >= 0)){ err.textContent = 'Enter a valid price.'; err.hidden = false; return; }
  var stock = parseInt($('#pfStock').value, 10);
  if(!(stock >= 0)){ err.textContent = 'Enter a valid stock count.'; err.hidden = false; return; }

  btn.disabled = true; btn.innerHTML = '<span class="spin" aria-hidden="true"></span> Saving\u2026';

  (photoFile ? uploadPhoto(id, photoFile) : Promise.resolve(existingImageUrl))
    .then(function(imageUrl){
      var payload = {
        name: $('#pfName').value.trim(),
        category: $('#pfCategory').value,
        price_myr: price,
        stock: stock,
        notes: $('#pfNotes').value.trim(),
        description: $('#pfDesc').value.trim(),
        ingredients: $('#pfIng').value.trim(),
        color: pickedColor, motif: pickedMotif, tone: pickedTone,
        image_url: imageUrl || null,
        best_seller: $('#pfBest').checked,
        active: $('#pfActive').checked
      };
      if(editingId){
        return api('/rest/v1/products?id=eq.' + encodeURIComponent(editingId), {
          method:'PATCH', headers:{'Content-Type':'application/json','Prefer':'return=representation'}, body: JSON.stringify(payload)
        });
      }
      payload.id = id;
      return api('/rest/v1/products', {
        method:'POST', headers:{'Content-Type':'application/json','Prefer':'return=representation'}, body: JSON.stringify(payload)
      });
    })
    .then(function(){
      $('#dlgProduct').close();
      toast(editingId ? 'Product updated' : 'Product added');
      loadProducts();
    })
    .catch(function(e){ err.textContent = e.message; err.hidden = false; })
    .then(function(){ btn.disabled = false; btn.textContent = 'Save product'; });
});

/* ---------- Boot ---------- */
renderOrderFilters();
if(session){
  checkAdmin().then(showApp).catch(function(){ signOut(); });
} else {
  document.getElementById('login').style.display = 'grid';
}
})();
</script>
</body>
</html>
