<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nice Soap: Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .login-card {
    max-width: 400px;
    margin: 4rem auto;
    padding: 2rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
  }
  .login-card h1 {
    font-size: 1.8rem;
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .form-group {
    margin-bottom: 1.2rem;
  }
  .form-group label {
    display: block;
    font-size: .9rem;
    font-weight: 600;
    margin-bottom: .4rem;
  }
  .form-input {
    width: 100%;
    padding: .75rem 1rem;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    box-sizing: border-box;
  }
</style>
</head>
<body>

<main class="wrap">
  <div class="login-card">
    <a class="brand" href="index.html" style="display:block;text-align:center;margin-bottom:1rem;">Nice Soap</a>
    <h1>Admin Login</h1>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-input" required placeholder="admin@nicesoap.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn" id="loginBtn" style="width:100%;justify-content:center;">Log In</button>
    </form>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
(function(){
  'use strict';
  var CFG = window.NICE_SOAP_CONFIG || {};

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2500);
  }

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var btn = document.getElementById('loginBtn');

    btn.disabled = true;
    btn.textContent = 'Authenticating...';

    var url = CFG.SUPABASE_URL.replace(/\/+$/, '') + '/auth/v1/token?grant_type=password';

    fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': CFG.SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ email: email, password: password })
    })
    .then(function(res){ return res.json(); })
    .then(function(data){
      if(data.access_token){
        // Store session tokens locally
        localStorage.setItem('ns_admin_token', data.access_token);
        localStorage.setItem('ns_admin_user', JSON.stringify(data.user));
        toast('Login successful! Redirecting...');
        setTimeout(function(){
          window.location.href = 'admin.html';
        }, 800);
      } else {
        toast(data.error_description || 'Invalid email or password');
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    })
    .catch(function(){
      toast('Network error. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Log In';
    });
  });
})();
</script>
</body>
</html>
